name: GitHub → Discord

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Envoyer le commit sur Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          message = os.environ.get("MESSAGE", "").strip()
          author = os.environ.get("AUTHOR", "Inconnu").strip()
          branch = os.environ.get("BRANCH", "inconnu").strip()
          repo = os.environ.get("REPO", "").strip()
          sha = os.environ.get("SHA", "").strip()
          server_url = os.environ.get("SERVER_URL", "").strip()
          webhook = os.environ.get("WEBHOOK", "").strip()

          if not message:
              message = "Commit sans message"

          # Séparer le titre et la description du commit
          lines = message.splitlines()

          title = lines[0][:256]
          description = "\n".join(lines[1:]).strip()

          if not description:
              description = "Aucune description"

          # Créer le lien vers le commit
          commit_url = f"{server_url}/{repo}/commit/{sha}"

          # Préparer le message Discord
          payload = {
              "username": "github bot",
              "content": f"💻 **Nouveau push sur `{branch}`**",
              "embeds": [
                  {
                      "title": title,
                      "url": commit_url,
                      "description": (
                          f"{description}\n\n"
                          f"👤 **Auteur :** {author}\n"
                          f"📁 **Dépôt :** `{repo}`\n\n"
                          f"🔗 [Voir le commit sur GitHub]({commit_url})"
                      )
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHubActions-DiscordWebhook/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord :", response.status)
          except urllib.error.HTTPError as error:
              print("Discord a refusé la requête :", error.code)
              print(error.read().decode("utf-8"))
              raise
          PY