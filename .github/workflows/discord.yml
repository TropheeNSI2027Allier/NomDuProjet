name: GitHub → Discord

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Envoyer les commits sur Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMPARE_URL: ${{ github.event.compare }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          commits = json.loads(os.environ["COMMITS"])

          description = ""

          for commit in commits:
              message = commit["message"].split("\n")[0]
              author = commit["author"]["name"]
              url = commit["url"]

              description += f"**{message}** — {author}\n"
              description += f"[Voir le commit]({url})\n\n"

          payload = {
              "username": "GitHub NSI",
              "embeds": [{
                  "title": f"💻 Push sur {os.environ['BRANCH']}",
                  "description": description[:4000],
                  "url": os.environ["COMPARE_URL"],
                  "fields": [
                      {
                          "name": "👤 Auteur du push",
                          "value": os.environ["ACTOR"],
                          "inline": True
                      },
                      {
                          "name": "📦 Commits",
                          "value": str(len(commits)),
                          "inline": True
                      }
                  ]
              }]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord:", response.status)
          PY
