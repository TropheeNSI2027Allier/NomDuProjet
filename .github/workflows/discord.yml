name: GitHub → Discord

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Envoyer le commit sur Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.html_url }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = {
              "username": "GitHub NSI",
              "embeds": [{
                  "title": f"💻 Push sur {os.environ['BRANCH']}",
                  "description": os.environ["MESSAGE"],
                  "fields": [{
                      "name": "👤 Auteur",
                      "value": os.environ["AUTHOR"],
                      "inline": True
                  }],
                  "url": os.environ["COMMIT_URL"]
              }]
          }

          request = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print("Discord:", response.status)
          PY