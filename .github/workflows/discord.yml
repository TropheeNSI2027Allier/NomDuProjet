name: GitHub → Discord

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Envoyer le commit sur Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.html_url }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          message = os.environ.get("MESSAGE", "").strip()
          author = os.environ.get("AUTHOR", "Inconnu").strip()
          branch = os.environ.get("BRANCH", "inconnu").strip()
          commit_url = os.environ.get("COMMIT_URL", "")
          repo = os.environ.get("REPO", "")

          if not message:
              message = "Commit sans message"

          payload = {
              "username": "Github Bot",
              "content": f"💻 **Nouveau push sur `{branch}`**",
              "embeds": [
                  {
                      "title": message[:256],
                      "description": f"👤 **Auteur :** {author}\n📁 **Dépôt :** `{repo}`\n\n🔗 [Voir le commit sur GitHub]({commit_url})",,
                      "url": commit_url if commit_url else None
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": 
          "GitHubActions-DiscordWebhook/1.0"
              },
              method="POST"
          )


          try:
              with urllib.request.urlopen(request) as response:
                  print("Discord:", response.status)
          except urllib.error.HTTPError as error:
              print("Discord a refusé la requête :", error.code)
              print(error.read().decode("utf-8"))
              raise
          PY
